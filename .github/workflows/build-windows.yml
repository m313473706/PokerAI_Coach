name: Build Poker AI Coach Ultimate Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, windows-screen-capture-vision, windows-visual-card-recognition ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装本机视觉组件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.15.0

      - name: 运行合成契约回归（仅验证代码路径）
        run: python -m unittest discover -s tests -v

      - name: 验证牌面安全状态
        run: python app.py --self-check

      - name: 检查牌面模型与真实截图回放报告
        shell: pwsh
        run: |
          $model = "models/playing_cards.onnx"
          $replayPath = "models/real_replay_report.json"
          if (!(Test-Path -LiteralPath $model)) {
            throw "未提供许可已核实的 models/playing_cards.onnx；拒绝打包 OCR-only 安装器。"
          }
          if (!(Test-Path -LiteralPath $replayPath)) {
            throw "缺少 models/real_replay_report.json；必须先完成目标模拟器截图回放。"
          }
          $report = Get-Content -Raw -LiteralPath $replayPath | ConvertFrom-Json
          if ($report.schema -ne "pokerai-real-replay-v1" -or $report.status -ne "passed") {
            throw "真实截图回放报告格式无效或状态不是 passed。"
          }
          $modelHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $model).Hash.ToLowerInvariant()
          if ("$($report.model_sha256)".ToLowerInvariant() -ne $modelHash) {
            throw "回放报告中的模型 SHA-256 与待打包模型不一致。"
          }
          $classes = @($report.expected_classes)
          $uniqueClasses = @($classes | Sort-Object -Unique)
          if ([int]$report.total_cards -lt 52 -or
              [int]$report.correct_cards -ne [int]$report.total_cards -or
              [int]$report.distinct_expected_classes -ne 52 -or
              $classes.Count -ne 52 -or $uniqueClasses.Count -ne 52 -or
              [int]$report.detection_misses -ne 0 -or
              [int]$report.spurious_detections -ne 0 -or
              [int]$report.low_confidence_count -ne 0) {
            throw "回放未覆盖全部 52 类并实现零漏检、零误检、零低置信度与全牌值正确。"
          }

      - name: 打包 Windows 程序
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PokerAI_Coach
          --collect-all rapidocr_onnxruntime
          --collect-all windows_capture
          --collect-all onnxruntime
          --add-data "models/playing_cards.onnx;models"
          --collect-all cv2
          app.py

      - name: 检查 EXE 和离线视觉模型
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PokerAI_Coach.exe")) { throw "未生成 PokerAI_Coach.exe" }
          $diagnostic = Join-Path $env:TEMP "PokerAI_Coach_self_check_error.txt"
          if (Test-Path $diagnostic) { Remove-Item -LiteralPath $diagnostic -Force }
          $process = Start-Process -FilePath "dist/PokerAI_Coach.exe" -ArgumentList "--self-check --require-model" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $diagnostic) {
              Write-Host "程序自检诊断："
              Get-Content -Raw -LiteralPath $diagnostic
            }
            throw "程序内置组件检查失败，退出码 $($process.ExitCode)"
          }

      - name: 生成中文 Windows 安装程序
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (!$iscc) {
            $candidate = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path -LiteralPath $candidate) { $iscc = Get-Item -LiteralPath $candidate }
          }
          if (!$iscc) { choco install innosetup --no-progress -y }
          if (!$iscc) {
            $candidate = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path -LiteralPath $candidate) { $iscc = Get-Item -LiteralPath $candidate }
          }
          if (!$iscc) { throw "找不到 Inno Setup 编译器" }
          & $iscc.Source "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows 安装程序编译失败，退出码 $LASTEXITCODE" }
          if (!(Test-Path "release/PokerAI_Coach_Ultimate_Setup.exe")) { throw "安装程序未生成" }
          Copy-Item "README.md" "release/README.md"
          Copy-Item "INSTALL.txt" "release/安装说明.txt"
          Compress-Archive -Path "release/*" -DestinationPath "PokerAI_Coach_Ultimate_Windows.zip" -Force

      - name: 检查交付包里的安装文件
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("PokerAI_Coach_Ultimate_Windows.zip")
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            $required = @("PokerAI_Coach_Ultimate_Setup.exe", "README.md", "安装说明.txt")
            foreach ($name in $required) {
              if ($entries -notcontains $name) { throw "交付包缺少文件：$name" }
            }
            $setup = $archive.GetEntry("PokerAI_Coach_Ultimate_Setup.exe")
            if ($setup.Length -lt 50000000) { throw "安装器大小异常：$($setup.Length) bytes" }
            Write-Host "交付包文件：$($entries -join ', ')"
            Write-Host "安装器大小：$($setup.Length) bytes"
          } finally {
            $archive.Dispose()
          }

      - name: 上传唯一 Windows 交付包
        uses: actions/upload-artifact@v4
        with:
          name: PokerAI_Coach_Ultimate_Windows
          path: PokerAI_Coach_Ultimate_Windows.zip
          if-no-files-found: error
          retention-days: 90
