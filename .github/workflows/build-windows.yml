name: Build PokerAI Coach Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PokerAI_Coach
          app.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\PokerAI_Coach.exe release\PokerAI_Coach.exe
          Copy-Item README.md release\README.md
          Compress-Archive -Path release\* -DestinationPath PokerAI_Coach_Windows.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PokerAI_Coach_Windows_EXE
          path: PokerAI_Coach_Windows.zip
