name: Build Poker AI Coach Windows Screen Vision

on:
  workflow_dispatch:
  push:
    branches: [ main, windows-screen-capture-vision ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装本机视觉组件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.15.0

      - name: 打包 Windows 程序
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PokerAI_Coach
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          --collect-all cv2
          app.py

      - name: 检查 EXE 和离线视觉模型
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PokerAI_Coach.exe")) { throw "未生成 PokerAI_Coach.exe" }
          & "dist/PokerAI_Coach.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "EXE 内置视觉模型检查失败" }

      - name: 准备交付包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/PokerAI_Coach.exe" "release/PokerAI_Coach.exe"
          Copy-Item "README.md" "release/README.md"
          Copy-Item "INSTALL.txt" "release/安装说明.txt"
          Compress-Archive -Path "release/*" -DestinationPath "PokerAI_Coach_Windows_ScreenVision.zip" -Force

      - name: 上传 Windows 构建包
        uses: actions/upload-artifact@v4
        with:
          name: PokerAI_Coach_Windows_ScreenVision
          path: PokerAI_Coach_Windows_ScreenVision.zip
          if-no-files-found: error
          retention-days: 30
