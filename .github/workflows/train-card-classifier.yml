name: Train in-house card classifier

on:
  workflow_dispatch:
  push:
    branches: [ windows-visual-card-recognition ]
    paths:
      - train_card_classifier.py
      - training-requirements.txt
      - .github/workflows/train-card-classifier.yml

permissions:
  contents: read

jobs:
  train-card-classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Poker AI Coach
        uses: actions/checkout@v4

      - name: Check out pinned CC0 card artwork
        uses: actions/checkout@v4
        with:
          repository: safe-acid/Playing-cards-assets
          ref: ae925833a28f587ec6abed561822889eb044a18c
          path: cc0-cards
          sparse-checkout: |
            LICENSE
            README.md
            Playing Cards/PNG Cards/Cards 254x354px

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training-requirements.txt

      - name: Train and export ONNX candidate
        run: >-
          python train_card_classifier.py
          --assets-dir "cc0-cards/Playing Cards/PNG Cards/Cards 254x354px"
          --output models/playing_cards.onnx
          --report models/card_model_training.json

      - name: Upload candidate model and report
        uses: actions/upload-artifact@v4
        with:
          name: pokerai-card-classifier-candidate
          path: |
            models/playing_cards.onnx
            models/card_model_training.json
          if-no-files-found: error
          retention-days: 90
